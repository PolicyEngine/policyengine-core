name: Pull request
on:
  pull_request:
    branches: [master]
jobs:
  Lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Check formatting
        run: uvx ruff format --check .
  lint-workflows:
    name: Lint workflows
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run actionlint
        # rhysd/actionlint 1.7.12. The image bundles shellcheck and pyflakes,
        # which actionlint runs on `run:` scripts.
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
  check-changelog:
    name: Check changelog fragment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check for changelog fragment
        run: |
          FRAGMENTS=$(find changelog.d -type f ! -name '.gitkeep' | wc -l)
          if [ "$FRAGMENTS" -eq 0 ]; then
            echo "::error::No changelog fragment found in changelog.d/"
            echo "Add one with: echo 'Description.' > changelog.d/\$(git branch --show-current).<type>.md"
            echo "Types: added, changed, fixed, removed, breaking"
            exit 1
          fi
  Test:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        python-version: [ "3.11", "3.12", "3.13", "3.14" ]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Enable long paths in Git (Windows only)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - name: Enable Win32 long paths via registry (Windows only)
        if: runner.os == 'Windows'
        run: reg add "HKEY_LOCAL_MACHINE\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Install package
        run: make install
      - name: Run tests
        run: make test
      - uses: codecov/codecov-action@v6
      - name: Build package
        run: make build
      - name: Test documentation builds
        run: make documentation
  SmokeTestForMultipleVersions:
    name: Test Core and country packages (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: Lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
      - name: Install Core and the migrated country smoke bundle
        # Resolve the checkout and all country dependencies together so a later
        # install cannot replace Core. Immutable country commits qualify this
        # draft; actual published country release constraints are required to merge.
        run: uv pip install --system . -r .github/requirements/migrated-country-smoke.txt "pytest-rerunfailures>=16.2,<17"
      - name: Verify installed dependency compatibility
        run: uv pip check --system
      - name: Verify pytest plugins
        run: python -m pytest --version
      - name: Check the standalone legacy SPM utility
        # SPM 0.3.1 does not import Core and cannot satisfy migrated US's SPM 1.x
        # requirement. Keep its small public API check isolated on the same runner.
        run: >-
          uv run --isolated --no-project --python "${{ matrix.python-version }}"
          --with "spm-calculator==0.3.1" python -c
          "from spm_calculator import spm_equivalence_scale; assert float(spm_equivalence_scale(2, 2)) == 1.0"
      - name: Run smoke tests only
        run: python -m pytest -m smoke --reruns 2 --reruns-delay 5 -v -s
        env:
          RUN_SMOKE_TESTS: "0"
          POLICYENGINE_GITHUB_MICRODATA_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
